<section class="login-card">
  <h2>Sign in</h2>
  <p class="hint">Sign in to submit tracks to DSPs and update their status.</p>

  <form (ngSubmit)="onSubmit()">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" [(ngModel)]="username" required autocomplete="username" />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      required
      autocomplete="current-password"
    />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</section>
