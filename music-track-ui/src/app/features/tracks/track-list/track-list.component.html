<section>
  <div class="toolbar">
    <label for="statusFilter">Filter by status</label>
    <select
      id="statusFilter"
      [value]="statusFilter()"
      (change)="onStatusFilterChange($any($event.target).value)"
    >
      <option value="">All statuses</option>
      @for (status of statuses; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>
  </div>

  @if (loading()) {
    <p>Loading tracks…</p>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else if (tracks().length === 0) {
    <p>No tracks found.</p>
  } @else {
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Artist</th>
          <th>Genre</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (track of tracks(); track track.id) {
          <tr [routerLink]="['/tracks', track.id]" class="row-link">
            <td>{{ track.title }}</td>
            <td>{{ track.artistName }}</td>
            <td>{{ track.genre }}</td>
            <td>
              <span class="status-badge" [attr.data-status]="track.status">{{ track.status }}</span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
